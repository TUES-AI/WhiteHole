name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy scipy pyyaml omegaconf torch gymnasium
      - name: Compile Python sources
        env:
          PYTHONPATH: .
        run: python -m compileall -q whitehole whitehole_envs scripts tests
      - name: Run environment tests
        run: python -m pytest -q tests/test_two_rooms_env.py
